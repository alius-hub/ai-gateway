services:
  redis:
    image: redis:7-alpine
    container_name: ai-gateway-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "Dev2026!"]
    ports:
      - "6379:6379"
    volumes:
      - ai-gateway-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Dev2026!", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ai-gateway-redis-data:
